services:
  - type: web
    name: p7-reto-pasos-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npm run prisma:generate && npm run prisma:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRA_EN
        value: 15m
      - key: CLIENTE_ORIGEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
